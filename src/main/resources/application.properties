spring.application.name=gabo-portfolio-api
server.port=${PORT:8080}
spring.datasource.url=${GABO_DATABASE_URL:jdbc:postgresql://localhost:55432/gabo_portfolio}
spring.datasource.username=${GABO_DATABASE_USER:gabo}
spring.datasource.password=${GABO_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=10000
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true
server.tomcat.max-http-form-post-size=710000
server.tomcat.max-part-count=1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Includes the API's own origin because native clients send that Origin.
gabo.allowed-origins=${GABO_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
gabo.cookie-secure=${GABO_COOKIE_SECURE:true}
gabo.admin-email=${BONDS_ADMIN_EMAIL:}
gabo.admin-password-hash=${BONDS_ADMIN_PASSWORD_HASH:}
gabo.friend-email=${BONDS_FRIEND_EMAIL:}
gabo.friend-password-hash=${BONDS_FRIEND_PASSWORD_HASH:}
gabo.cron-secret=${CRON_SECRET:}
gabo.snapshot-secret=${BONDS_MARKET_SNAPSHOT_SECRET:}
gabo.import-web-directory=${GABO_IMPORT_WEB_DIRECTORY:}

# Optional native push providers. Blank credentials leave in-app alerts fully usable.
gabo.push.firebase-project=${GABO_PUSH_FIREBASE_PROJECT:}
gabo.push.apple-team=${GABO_PUSH_APPLE_TEAM:}
gabo.push.apple-key-id=${GABO_PUSH_APPLE_KEY_ID:}
gabo.push.apple-key=${GABO_PUSH_APPLE_KEY:}
gabo.push.apple-topic=${GABO_PUSH_APPLE_TOPIC:dev.orestegabo.portfolio.Portfolio}

# Temporary opt-in monotonic timings; no SQL, parameters, identities, or credentials are logged.
gabo.performance-diagnostics=${GABO_PERFORMANCE_DIAGNOSTICS:false}
