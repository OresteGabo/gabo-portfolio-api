# Activate with SPRING_PROFILES_ACTIVE=cloudrun on the hosted service only.
# Fail startup if remote database configuration is absent; never fall back to localhost.
spring.datasource.url=${GABO_DATABASE_URL}
spring.datasource.username=${GABO_DATABASE_USER}
spring.datasource.password=${GABO_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=60000
gabo.cookie-secure=true
gabo.import-web-directory=
# Flyway needs a direct connection; application queries can use Neon's pooler.
spring.flyway.url=${GABO_MIGRATION_DATABASE_URL:${GABO_DATABASE_URL}}
spring.flyway.user=${GABO_DATABASE_USER}
spring.flyway.password=${GABO_DATABASE_PASSWORD}
# Neon's transaction pooler rejects statement_timeout in startup options.
spring.datasource.hikari.data-source-properties.options=
spring.jdbc.template.query-timeout=10s
